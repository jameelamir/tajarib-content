services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-dev}
    image: tajarib-app
    container_name: tajarib-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-7430}:7430"
    environment:
      - EPISODES_DIR=/data/episodes
      - UPLOADS_DIR=/data/uploads
      - TAJARIB_CONFIG_DIR=/data/config
    env_file:
      - .env
    volumes:
      - ${DATA_DIR:-/opt/tajarib-data}:/data

  webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    image: tajarib-webhook
    container_name: tajarib-webhook
    restart: unless-stopped
    ports:
      - "${WEBHOOK_PORT:-9000}:9000"
    environment:
      - COMPOSE_PROJECT_NAME=tajarib
    env_file:
      - .env
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /repo
